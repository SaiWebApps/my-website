<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,200;0,400;1,400&family=Martian+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0}
  html,body{width:1200px;height:630px}
  body{
    background:#F4F1EA;color:#14120F;
    font-family:'Spectral',Georgia,serif;
    display:flex;align-items:stretch;
    -webkit-font-smoothing:antialiased;
  }
  .left{flex:1 1 auto;padding:64px 0 56px 68px;display:flex;flex-direction:column;justify-content:space-between}
  .eyebrow{font-family:'Martian Mono',monospace;font-size:13px;letter-spacing:0.24em;text-transform:uppercase;color:#7A2E2E}
  h1{font-weight:200;font-size:76px;line-height:1.02;letter-spacing:-0.03em;max-width:15ch;margin:30px 0 0}
  .rule{width:64px;height:1px;background:#7A2E2E;margin:32px 0 26px}
  .lede{font-size:21px;line-height:1.45;color:#413A2F;max-width:34ch}
  .foot{display:flex;align-items:baseline;gap:22px;font-family:'Martian Mono',monospace;font-size:13px;letter-spacing:0.16em;text-transform:uppercase;color:#6E685C}
  .foot .name{font-family:'Spectral',Georgia,serif;font-style:italic;font-size:22px;letter-spacing:0.01em;color:#7A2E2E;text-transform:none}
  figure{flex:0 0 372px;margin:0;border-left:1px solid #D8D1C2}
  img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 22%;filter:saturate(.82) contrast(1.02)}
</style>
</head>
<body>
  <div class="left">
    <div>
      <div class="eyebrow">Engineering leadership &middot; AI &amp; ML</div>
      <h1>I take AI from whiteboard to boardroom.</h1>
      <div class="rule"></div>
      <p class="lede">Senior AI/ML engineering leader at Apple. Wharton MBA 2026.</p>
    </div>
    <div class="foot">
      <span class="name">Sairam Krishnan</span>
      <span>sairambkrishnan.com</span>
    </div>
  </div>
  <figure><img src="assets/portrait.jpg" alt=""></figure>
</body>
</html>
