<section class="stadium" id="eagles" aria-labelledby="eagles-h">
  <div class="pagehead pagehead--tight">
    <h1>Speaking</h1>
  </div>
  <div class="stadium__stage" data-line="orange">
    <svg class="stadium__svg" aria-hidden="true" focusable="false"><path class="stadium__path" fill="none" stroke="#F7941D" stroke-width="22" stroke-linejoin="round"/></svg>
    <div class="stadium__loop">
      <p class="stadium__kicker">Philadelphia Eagles, 12th annual Eagles Care Summit, Mar 18, 2026</p>
      <h2 id="eagles-h" class="stadium__title">AI for Impact</h2>
      <p class="stadium__count">300+ community and business leaders</p>
      <p class="stadium__src">{{sources}}</p>
    </div>
  </div>
</section>

<section class="teach" data-ride data-start="jacobson-strategic" aria-labelledby="praxtera-h">
  <div class="pagehead" id="praxtera">
    <h2 id="praxtera-h" class="h2">Praxtera AI Institute</h2>
    <p class="lede">{{praxtera}}</p>
  </div>
  <div class="strip" data-line="orange" style="--stops:{{nstops}}">
    <div class="strip__scroll">
      <div class="strip__line">
        {{zones}}
        <div class="strip__stops" role="tablist" aria-label="Where I taught">{{stops}}</div>
      </div>
    </div>
  </div>
  <div class="platforms" data-line="orange">
{{platforms}}
  </div>
</section>

<section class="topics" id="talks" aria-labelledby="topics-h">
  <h2 id="topics-h" class="h2">Talks I give</h2>
  <div class="blind" data-blind>
    <div class="blind__window">
      <ul class="blind__roll">{{topics}}</ul>
    </div>
    <div class="blind__ctl">
      <button class="btn btn--line" type="button" data-blind-prev>Previous</button>
      <button class="btn" type="button" data-blind-next>Next</button>
    </div>
  </div>
</section>

<section class="fares" id="fee" aria-label="Keynote and masterclass">
  <div class="fares__copy">
    <a class="btn" data-line="orange" href="mailto:sairambkrishnan@gmail.com?subject=Keynote">Book a talk</a>
  </div>
  <div class="fares__fan">{{tickets}}</div>
</section>
